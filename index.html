<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Venkateshwara Agency — Register</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#182338">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VK Agency">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app">
  <div class="auth-wrap"><div class="auth-card" style="text-align:center;color:var(--muted);">Opening the register…</div></div>
</div>
<script src="firebase-init.js"></script>
<script src="common.js"></script>
<script>
function renderLogin(errMsg){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="emblem">V</div>
      <h1 class="auth-title">Venkateshwara Agency</h1>
      <p class="auth-sub">Sign in to the register</p>
      <div id="loginErr">${errMsg?`<div class="auth-err">${esc(errMsg)}</div>`:''}</div>
      <div class="field"><label>Sign in as</label>
        <select id="loginRole"><option value="owner">Owner</option><option value="supervisor">Supervisor</option></select>
      </div>
      <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="Your password" onkeydown="if(event.key==='Enter')handleLogin()"></div>
      <button class="btn btn-primary" onclick="handleLogin()">Sign in</button>
      <p class="auth-note">Owner and Supervisor accounts only, managed in Firebase Authentication.</p>
    </div>
  </div>`;
}

async function handleLogin(){
  const role = document.getElementById('loginRole').value;
  const p = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginErr');
  errBox.innerHTML = '';
  const email = role === 'owner' ? OWNER_EMAIL : SUPERVISOR_EMAIL;
  try{
    await auth.signInWithEmailAndPassword(email, p);
    window.location.href = 'dashboard.html';
  }catch(e){
    errBox.innerHTML = `<div class="auth-err">Sign-in failed: ${esc(e.message || 'incorrect password')}</div>`;
  }
}

(function boot(){
  const app = document.getElementById('app');
  if(CONFIG_IS_PLACEHOLDER){
    app.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <div class="emblem">V</div>
      <h1 class="auth-title">Venkateshwara Agency</h1>
      <p class="auth-sub">Firebase not configured yet</p>
      <p style="font-size:13.5px;line-height:1.6;color:var(--ink);">
        Open <code>firebase-init.js</code> and paste in your project's config values, and set
        <code>OWNER_EMAIL</code> / <code>SUPERVISOR_EMAIL</code> to the two accounts you created in
        Firebase Authentication. Save and reload.
      </p>
    </div></div>`;
    return;
  }
  waitForAuthUser().then((user) => {
    if(user){
      const ok = (user.email && (user.email.toLowerCase()===OWNER_EMAIL.toLowerCase() || user.email.toLowerCase()===SUPERVISOR_EMAIL.toLowerCase()));
      if(ok){ window.location.href = 'dashboard.html'; return; }
      auth.signOut().then(()=>renderLogin('That account is not set as Owner or Supervisor in this app.'));
      return;
    }
    renderLogin();
  });
})();
</script>
</body>
</html>
