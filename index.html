<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venkateshwar Agency — Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --navy:#182338; --navy-2:#233252; --paper:#F6F3EC; --paper-2:#EFEADD;
    --rule:#DDD5C0; --ink:#20261F; --brass:#A9782F; --brass-2:#C79A4B;
    --maroon:#8C3230; --green:#3B6B4A; --card:#FFFFFF; --border:#E1DBC7; --muted:#7A7266;
    --font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  #app{min-height:100vh;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select{font-family:var(--font-body);}
  .mono{font-family:var(--font-mono);}
  ::selection{background:var(--brass-2);color:#fff;}

  /* ---------- centered auth screens ---------- */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      linear-gradient(var(--paper) 0%, var(--paper) 100%),
      repeating-linear-gradient(to bottom, transparent 0 39px, var(--rule) 39px 40px);
  }
  .auth-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:36px 32px;box-shadow:0 20px 50px -20px rgba(24,35,56,0.25);}
  .emblem{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 30% 30%, var(--brass-2), var(--brass));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;
    font-size:26px;margin:0 auto 16px;box-shadow:0 4px 14px rgba(169,120,47,0.4);}
  .auth-title{font-family:var(--font-display);font-weight:700;font-size:26px;text-align:center;margin:0;letter-spacing:0.2px;}
  .auth-sub{text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;margin:6px 0 26px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:0.3px;}
  .field input, .field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14.5px;
    background:#FCFBF8;color:var(--ink);}
  .field input:focus, .field select:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(169,120,47,0.15);}
  .btn{border:none;border-radius:6px;padding:10px 16px;font-size:14px;font-weight:600;letter-spacing:0.2px;transition:transform .05s ease;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--navy);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-brass{background:var(--brass);color:#fff;}
  .btn-brass:hover{background:#96692A;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-danger{background:#fff;border:1px solid var(--maroon);color:var(--maroon);}
  .btn-danger:hover{background:var(--maroon);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:5px;}
  .auth-err{background:#FBEAEA;border:1px solid #E9B9B7;color:var(--maroon);font-size:13px;padding:8px 12px;border-radius:6px;margin-bottom:14px;}
  .auth-note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5;}
  .divider-row{display:flex;align-items:center;gap:10px;margin:22px 0 16px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:1px;}
  .divider-row::before, .divider-row::after{content:"";flex:1;height:1px;background:var(--rule);}

  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:230px;flex-shrink:0;background:var(--navy);color:#E9E4D6;display:flex;flex-direction:column;padding:22px 16px;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:16px;}
  .brand .emblem{width:34px;height:34px;font-size:16px;margin:0;}
  .brand-text .t1{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.1;}
  .brand-text .t2{font-size:10px;letter-spacing:1.2px;color:#B9AF95;text-transform:uppercase;}
  .navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;color:#CFC9B6;font-size:13.5px;font-weight:500;
    margin-bottom:2px;border-left:3px solid transparent;}
  .navitem:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .navitem.active{background:var(--navy-2);color:#fff;border-left:3px solid var(--brass-2);}
  .navitem .ic{width:16px;text-align:center;font-size:14px;}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1);font-size:11px;color:#8B8266;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:62px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;padding:0 26px;flex-shrink:0;}
  .topbar h1{font-family:var(--font-display);font-size:18px;margin:0;font-weight:600;}
  .userpill{display:flex;align-items:center;gap:10px;}
  .userpill .who{font-size:13px;text-align:right;line-height:1.3;}
  .userpill .who b{display:block;font-size:13.5px;}
  .userpill .who span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.6px;}
  .content{padding:26px;overflow:auto;flex:1;}
  .grid{display:grid;gap:16px;}
  .cards4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){.cards4{grid-template-columns:repeat(2,1fr);}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;}
  .stat .num{font-family:var(--font-mono);font-size:26px;font-weight:600;}
  .stat .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:0.6px;margin-top:2px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .section-head h2{font-family:var(--font-display);font-size:19px;margin:0;font-weight:600;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;padding:9px 10px;border-bottom:2px solid var(--ink);color:var(--ink);font-weight:600;font-size:12px;
    text-transform:uppercase;letter-spacing:0.4px;}
  tbody td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:middle;}
  tbody tr:hover{background:#FBFAF6;}
  .num-cell{font-family:var(--font-mono);text-align:right;}
  .deduction{color:var(--maroon);}
  .positive{color:var(--green);}
  .zonetag{background:var(--paper-2);border:1px solid var(--border);padding:2px 8px;border-radius:20px;font-size:11.5px;}
  .modal-bg{position:fixed;inset:0;background:rgba(24,35,56,0.45);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:10px;max-width:520px;width:100%;padding:24px 26px;max-height:88vh;overflow:auto;}
  .modal h3{font-family:var(--font-display);margin:0 0 16px;font-size:19px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .big{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px;}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.3px;}
  .badge-P{background:#E4EFE7;color:var(--green);} .badge-A{background:#F6E4E3;color:var(--maroon);}
  .badge-H{background:#F6EEDD;color:#8A6417;} .badge-L{background:#E7EAF0;color:#465580;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0;}
  .cal .dcell{aspect-ratio:1;border:1px solid var(--border);border-radius:6px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:12px;background:#FCFBF8;font-family:var(--font-mono);}
  .cal .dcell .dn{font-size:10px;color:var(--muted);}
  .cal .dcell.st-P{background:#E4EFE7;border-color:#BFDAC7;}
  .cal .dcell.st-A{background:#F6E4E3;border-color:#E5B9B6;}
  .cal .dcell.st-H{background:#F6EEDD;border-color:#E7CE94;}
  .cal .dcell.st-L{background:#E7EAF0;border-color:#C3CAE0;}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-bottom:8px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;
    font-size:13.5px;box-shadow:0 10px 28px rgba(0,0,0,0.25);z-index:100;max-width:320px;}
  .helptext{font-size:12px;color:var(--muted);margin-top:4px;}
  .row{display:flex;gap:12px;}
  .row > div{flex:1;}
  .hamburger{display:none;background:none;border:none;color:#fff;font-size:20px;padding:4px 8px;}
  @media(max-width:820px){
    .sidebar{position:fixed;left:-250px;top:0;bottom:0;z-index:60;transition:left .2s ease;box-shadow:8px 0 30px rgba(0,0,0,0.3);}
    .sidebar.open{left:0;}
    .hamburger{display:inline-block;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================= FIREBASE CONFIG =============================
   PASTE YOUR OWN VALUES BELOW (from Firebase Console > Project settings > General
   > Your apps > SDK setup and configuration). Also set the two real email
   addresses you create as Owner / Supervisor accounts in Firebase Authentication.
============================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDyuXwyXKtGaa93voUI6pYQ0PKVGBkHTj8",
  authDomain: "venkateshwaraagency-58ad6.firebaseapp.com",
  projectId: "venkateshwaraagency-58ad6",
  storageBucket: "venkateshwaraagency-58ad6.firebasestorage.app",
  messagingSenderId: "150440209378",
  appId: "1:150440209378:web:55e52f29d95934c9fc27bb"
};
const OWNER_EMAIL = "eegamsrikar157@gmail.com";      // must match an account you create in Firebase Auth
const SUPERVISOR_EMAIL = "supervisor@example.com";   // must match an account you create in Firebase Auth
/* ========================================================================= */

const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey.includes('PASTE_YOUR');
let fbApp = null, auth = null, db = null;
if(!CONFIG_IS_PLACEHOLDER){
  fbApp = firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
}

/* ============================= STORAGE HELPERS (Firestore) ============================= */
async function sget(key){
  try{
    const doc = await db.collection('venk_data').doc(key).get();
    if(!doc.exists) return null;
    const data = doc.data();
    return (data && data.value !== undefined) ? JSON.parse(data.value) : null;
  }catch(e){ console.error('Firestore get failed', key, e); return null; }
}
async function sset(key, value){
  try{
    await db.collection('venk_data').doc(key).set({ value: JSON.stringify(value), updatedAt: Date.now() });
    return true;
  }catch(e){ console.error('Firestore set failed', key, e); return false; }
}

/* ============================= UTIL ============================= */
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)+Date.now()); }
function inr(n){ if(isNaN(n)) n=0; return '₹' + Number(n).toLocaleString('en-IN', {maximumFractionDigits:2, minimumFractionDigits:2}); }
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
function monthLabel(yyyymm){
  const [y,m] = yyyymm.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleString('en-IN', {month:'long', year:'numeric'});
}
function todayYYYYMM(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function daysInCalMonth(yyyymm){ const [y,m]=yyyymm.split('-').map(Number); return new Date(y,m,0).getDate(); }
function fmtTs(ts){ return new Date(ts).toLocaleString('en-IN', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
let toastTimer=null;
function toast(msg){
  let t = document.getElementById('toast');
  if(t) t.remove();
  t = document.createElement('div'); t.id='toast'; t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 3200);
}

/* ============================= APP STATE ============================= */
let session = null; // {role, username}
let ZONES = [], EMPLOYEES = [], SETTINGS = {}, LOGS = [];
let currentView = 'dashboard';
let sidebarOpen = false;

const DEFAULT_SETTINGS = { salaryDayBasis: 'calendar', defaultPfPercent: 12 };

async function logAction(action, details=''){
  let logs = await sget('logs') || [];
  logs.unshift({ id: uid(), ts: Date.now(), user: session ? session.username : 'system', role: session ? session.role : '-', action, details });
  if(logs.length > 500) logs = logs.slice(0,500);
  await sset('logs', logs);
  LOGS = logs;
}

/* ============================= BOOTSTRAP ============================= */
function boot(){
  const app = document.getElementById('app');
  if(CONFIG_IS_PLACEHOLDER){
    app.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <div class="emblem">V</div>
      <h1 class="auth-title">Venkateshwar Agency</h1>
      <p class="auth-sub">Firebase not configured yet</p>
      <p style="font-size:13.5px;line-height:1.6;color:var(--ink);">
        Open this file in a text editor and find the <b>FIREBASE CONFIG</b> section near the top of the
        <code>&lt;script&gt;</code> block. Paste in your project's config values, and set
        <code>OWNER_EMAIL</code> / <code>SUPERVISOR_EMAIL</code> to the two accounts you created in
        Firebase Authentication. Save the file and reload.
      </p>
    </div></div>`;
    return;
  }
  app.innerHTML = `<div class="auth-wrap"><div class="auth-card" style="text-align:center;color:var(--muted);">Opening the register…</div></div>`;
  auth.onAuthStateChanged(async (user) => {
    if(user){
      let role = null;
      if(user.email && user.email.toLowerCase() === OWNER_EMAIL.toLowerCase()) role = 'owner';
      else if(user.email && user.email.toLowerCase() === SUPERVISOR_EMAIL.toLowerCase()) role = 'supervisor';
      if(!role){
        await auth.signOut();
        renderLogin('That account is signed in to Firebase but is not set as Owner or Supervisor in this file.');
        return;
      }
      session = { role, username: user.email };
      await loadAllData();
      await logAction('Signed in');
      currentView = 'dashboard';
      renderShell();
    } else {
      session = null;
      renderLogin();
    }
  });
}
boot();

/* ============================= LOGIN SCREEN ============================= */
function renderLogin(errMsg){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="emblem">V</div>
      <h1 class="auth-title">Venkateshwar Agency</h1>
      <p class="auth-sub">Sign in to the register</p>
      <div id="loginErr">${errMsg?`<div class="auth-err">${esc(errMsg)}</div>`:''}</div>
      <div class="field"><label>Sign in as</label>
        <select id="loginRole"><option value="owner">Owner</option><option value="supervisor">Supervisor</option></select>
      </div>
      <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="Your password" onkeydown="if(event.key==='Enter')handleLogin()"></div>
      <button class="btn btn-primary" onclick="handleLogin()">Sign in</button>
      <p class="auth-note">Owner and Supervisor accounts only, managed in Firebase Authentication. Forgot your password? Use the reset link in the Account tab after asking the other person to sign in and send it, or use Firebase Console directly.</p>
    </div>
  </div>`;
  document.getElementById('loginPass').focus();
}

async function handleLogin(){
  const role = document.getElementById('loginRole').value;
  const p = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginErr');
  errBox.innerHTML = '';
  const email = role === 'owner' ? OWNER_EMAIL : SUPERVISOR_EMAIL;
  try{
    await auth.signInWithEmailAndPassword(email, p);
    // onAuthStateChanged will take it from here
  }catch(e){
    errBox.innerHTML = `<div class="auth-err">Sign-in failed: ${esc(e.message || 'incorrect password')}</div>`;
  }
}

function handleLogout(){
  logAction('Signed out').then(()=>{ auth.signOut(); });
}

async function loadAllData(){
  ZONES = await sget('zones') || [];
  EMPLOYEES = await sget('employees') || [];
  SETTINGS = await sget('settings') || {...DEFAULT_SETTINGS};
  LOGS = await sget('logs') || [];
}

/* ============================= SHELL / NAV ============================= */
const NAV = [
  {id:'dashboard', label:'Dashboard', ic:'◆'},
  {id:'zones', label:'Zones', ic:'▤'},
  {id:'employees', label:'Employees', ic:'☺'},
  {id:'attendance', label:'Attendance', ic:'☷'},
  {id:'reports', label:'Reports', ic:'▧'},
  {id:'history', label:'History', ic:'⏱'},
  {id:'account', label:'Account', ic:'⚙'},
];

function renderShell(){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="shell">
    <div class="sidebar ${sidebarOpen?'open':''}" id="sidebar">
      <div class="brand">
        <div class="emblem">V</div>
        <div class="brand-text"><div class="t1">Venkateshwar</div><div class="t2">Agency Register</div></div>
      </div>
      <div id="navlist"></div>
      <div class="sidebar-foot">Signed in as<br><b style="color:#E9E4D6;">${esc(session.username)}</b> · ${session.role}</div>
    </div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="hamburger" onclick="toggleSidebar()">☰</button>
          <h1 id="viewTitle"></h1>
        </div>
        <div class="userpill">
          <div class="who"><b>${esc(session.username)}</b><span>${session.role}</span></div>
          <button class="btn btn-outline btn-sm" onclick="handleLogout()">Sign out</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>`;
  renderNav();
  renderView();
}

function toggleSidebar(){ sidebarOpen = !sidebarOpen; document.getElementById('sidebar').classList.toggle('open', sidebarOpen); }

function renderNav(){
  const nl = document.getElementById('navlist');
  nl.innerHTML = NAV.map(n => `
    <div class="navitem ${currentView===n.id?'active':''}" onclick="goTo('${n.id}')">
      <span class="ic">${n.ic}</span><span>${n.label}</span>
    </div>`).join('');
}
function goTo(view){ currentView = view; sidebarOpen=false; document.getElementById('sidebar').classList.remove('open'); renderNav(); renderView(); }

function renderView(){
  const titles = {dashboard:'Dashboard', zones:'Zones', employees:'Employees', attendance:'Attendance', reports:'Reports', history:'History & Audit Log', account:'Account'};
  document.getElementById('viewTitle').textContent = titles[currentView] || '';
  const c = document.getElementById('content');
  if(currentView==='dashboard') c.innerHTML = viewDashboard();
  else if(currentView==='zones'){ c.innerHTML = viewZones(); }
  else if(currentView==='employees'){ c.innerHTML = viewEmployees(); }
  else if(currentView==='attendance'){ c.innerHTML = viewAttendance(); bindAttendanceEvents(); }
  else if(currentView==='reports'){ c.innerHTML = viewReports(); bindReportEvents(); }
  else if(currentView==='history'){ c.innerHTML = viewHistory(); }
  else if(currentView==='account'){ c.innerHTML = viewAccount(); }
}

/* ============================= DASHBOARD ============================= */
function viewDashboard(){
  const activeEmp = EMPLOYEES.filter(e=>e.active!==false);
  const recent = LOGS.slice(0,6);
  return `
  <div class="grid cards4" style="margin-bottom:20px;">
    <div class="card stat"><div class="num">${ZONES.length}</div><div class="lbl">Zones</div></div>
    <div class="card stat"><div class="num">${activeEmp.length}</div><div class="lbl">Active employees</div></div>
    <div class="card stat"><div class="num">${EMPLOYEES.length - activeEmp.length}</div><div class="lbl">Inactive employees</div></div>
    <div class="card stat"><div class="num">${LOGS.length}</div><div class="lbl">Logged actions</div></div>
  </div>
  <div class="card">
    <div class="section-head"><h2>Recent activity</h2><span style="font-size:12.5px;color:var(--muted);cursor:pointer;" onclick="goTo('history')">View full history →</span></div>
    ${recent.length===0 ? `<div class="empty">No activity yet.</div>` : `
    <table><thead><tr><th>When</th><th>Who</th><th>Action</th></tr></thead><tbody>

async function deleteZone(id){

async function saveEmployee(id){
  const name = document.getElementById('empName').value.trim();
  const zoneId = document.getElementById('empZone').value;
  const salary = parseFloat(document.getElementById('empSalary').value);
  const pf = parseFloat(document.getElementById('empPf').value);
  const join = document.getElementById('empJoin').value;
  if(!name) return toast('Enter the employee name.');
  if(!zoneId) return toast('Select a zone.');
  if(isNaN(salary) || salary < 0) return toast('Enter a valid monthly salary.');
  if(isNaN(pf) || pf < 0 || pf > 100) return toast('Enter a valid PF percentage (0–100).');

  if(id){
    const e = EMPLOYEES.find(x=>x.id===id);
    const changes = [];
    if(e.name!==name) changes.push('name');
    if(e.zoneId!==zoneId) changes.push('zone');
    if(e.monthlySalary!==salary) changes.push('salary');
    if(e.pfPercent!==pf) changes.push('PF %');
    if(e.joinDate!==join) changes.push('joining date');
    Object.assign(e, { name, zoneId, monthlySalary: salary, pfPercent: pf, joinDate: join });
    await sset('employees', EMPLOYEES);
    await logAction('Updated employee', `${name}${changes.length?' — changed '+changes.join(', '):''}`);
    toast(`${name} updated.`);
  } else {
    EMPLOYEES.push({ id: uid(), name, zoneId, monthlySalary: salary, pfPercent: pf, joinDate: join || null, active: true, createdAt: Date.now() });
    await sset('employees', EMPLOYEES);
    await logAction('Added employee', `${name} (${zoneName(zoneId)})`);
    toast(`${name} added.`);
  }
  closeModal('empModal');
  renderView();
}

async function toggleEmployeeActive(id){
  const e = EMPLOYEES.find(x=>x.id===id);
  if(!e) return;
  const willBeActive = e.active===false;
  if(!willBeActive && !confirm(`Deactivate ${e.name}? Their records stay intact for reports, but they'll be hidden from active lists.`)) return;
  e.active = willBeActive;
  await sset('employees', EMPLOYEES);
  await logAction(willBeActive?'Reactivated employee':'Deactivated employee', e.name);
  renderView();
}

/* ============================= ATTENDANCE ============================= */
function attKey(empId, yyyymm){ return `att:${empId}:${yyyymm}`; }

function summarize(dataObj){
  let P=0,A=0,H=0,L=0;
  Object.values(dataObj||{}).forEach(v=>{ if(v==='P')P++; else if(v==='A')A++; else if(v==='H')H++; else if(v==='L')L++; });
  return {P,A,H,L, marked:P+A+H+L};
}

let ATT_CACHE = {}; // key -> data, populated on demand

function viewAttendance(){
  const month = window.__attMonth || todayYYYYMM();
  const activeEmp = EMPLOYEES.filter(e=>e.active!==false);
  return `

  </div>
  ${activeEmp.length===0 ? `<div class="card"><div class="empty"><div class="big">No active employees</div>Add employees before marking attendance.</div></div>` : `
  <div class="card">
    <div class="section-head"><h2>${monthLabel(month)}</h2></div>
    <table><thead><tr><th>Employee</th><th>Zone</th><th>Present</th><th>Half-day</th><th>Absent</th><th>Leave</th><th></th></tr></thead>
    <tbody id="attTbody">
      ${activeEmp.map(e=>`
      <tr data-emp="${e.id}">
        <td><b>${esc(e.name)}</b></td>
        <td><span class="zonetag">${esc(zoneName(e.zoneId))}</span></td>
        <td class="num-cell" id="sumP-${e.id}">…</td>
        <td class="num-cell" id="sumH-${e.id}">…</td>
        <td class="num-cell deduction" id="sumA-${e.id}">…</td>
        <td class="num-cell" id="sumL-${e.id}">…</td>
        <td style="text-align:right;"><button class="btn btn-outline btn-sm" onclick="openAttendanceModal('${e.id}','${month}')">Mark days</button></td>
      </tr>`).join('')}
    </tbody></table>
  </div>`}`;
}

async function bindAttendanceEvents(){
  const month = window.__attMonth || todayYYYYMM();
  const activeEmp = EMPLOYEES.filter(e=>e.active!==false);
  for(const e of activeEmp){
    const data = await sget(attKey(e.id, month)) || {};
    ATT_CACHE[attKey(e.id, month)] = data;
    const s = summarize(data);
    const setEl = (id,val)=>{ const el=document.getElementById(id); if(el) el.textContent = val; };
    setEl(`sumP-${e.id}`, s.P); setEl(`sumH-${e.id}`, s.H); setEl(`sumA-${e.id}`, s.A); setEl(`sumL-${e.id}`, s.L);
  }
}

const STATUS_CYCLE = [undefined, 'P', 'H', 'A', 'L'];

function openAttendanceModal(empId, month){
  const emp = EMPLOYEES.find(e=>e.id===empId);
  const key = attKey(empId, month);
  const data = ATT_CACHE[key] || {};
  const totalDays = daysInCalMonth(month);
  const [y,m] = month.split('-').map(Number);
  const firstDow = new Date(y, m-1, 1).getDay(); // 0=Sun

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div></div>`;
  for(let d=1; d<=totalDays; d++){
    const st = data[d];
    cells += `<div class="dcell ${st?'st-'+st:''}" data-day="${d}" onclick="cycleDay(${d})">
      <div class="dn">${d}</div><div>${st||'—'}</div>
    </div>`;
  }

  document.body.insertAdjacentHTML('beforeend', `
  <div class="modal-bg" id="attModal">
    <div class="modal" style="max-width:520px;">
      <h3>${esc(emp.name)} — ${monthLabel(month)}</h3>
      <div class="legend">
        <span><span class="dot" style="background:#3B6B4A;"></span>P = Present</span>
        <span><span class="dot" style="background:#8A6417;"></span>H = Half-day</span>
        <span><span class="dot" style="background:#8C3230;"></span>A = Absent</span>
        <span><span class="dot" style="background:#465580;"></span>L = Leave</span>
      </div>
      <p class="helptext">Click a day to cycle through Present → Half-day → Absent → Leave → blank.</p>
      <div class="cal" id="calGrid">${cells}</div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline btn-sm" onclick="markAllPresent(${totalDays})">Mark all Present</button>
        <button class="btn btn-outline btn-sm" onclick="clearAllDays()">Clear all</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('attModal')">Cancel</button>
        <button class="btn btn-primary" style="width:auto;" onclick="saveAttendance('${empId}','${month}')">Save attendance</button>
      </div>
    </div>
  </div>`);
  window.__calData = {...data};
  window.__calTotalDays = totalDays;
}

function refreshCalGrid(){
  document.querySelectorAll('#calGrid .dcell[data-day]').forEach(cell=>{
    const d = cell.getAttribute('data-day');
    const st = window.__calData[d];
    cell.className = 'dcell ' + (st ? 'st-'+st : '');
    cell.innerHTML = `<div class="dn">${d}</div><div>${st||'—'}</div>`;
  });
}
function cycleDay(day){
  const cur = window.__calData[day];
  const idx = STATUS_CYCLE.indexOf(cur);
  const next = STATUS_CYCLE[(idx+1) % STATUS_CYCLE.length];
  if(next === undefined) delete window.__calData[day];
  else window.__calData[day] = next;
  refreshCalGrid();
}
function markAllPresent(totalDays){
  for(let d=1; d<=totalDays; d++) window.__calData[d] = 'P';
  refreshCalGrid();
}
function clearAllDays(){ window.__calData = {}; refreshCalGrid(); }

async function saveAttendance(empId, month){
  const key = attKey(empId, month);
  await sset(key, window.__calData);
  ATT_CACHE[key] = {...window.__calData};
  const emp = EMPLOYEES.find(e=>e.id===empId);
  await logAction('Updated attendance', `${emp.name} — ${monthLabel(month)}`);
  closeModal('attModal');
  bindAttendanceEvents();
  toast('Attendance saved.');
}

/* ============================= SALARY CALC ============================= */
function salaryBasisDays(month){
  if(SETTINGS.salaryDayBasis === 'calendar') return daysInCalMonth(month);
  return Number(SETTINGS.salaryDayBasis);
}
function computeSalary(emp, attData, month){
  const s = summarize(attData);
  const presentEquiv = s.P + s.H*0.5;
  const basisDays = salaryBasisDays(month);
  const perDay = basisDays ? emp.monthlySalary / basisDays : 0;
  const gross = perDay * presentEquiv;
  const pf = gross * (emp.pfPercent/100);
  const net = gross - pf;
  return { ...s, presentEquiv, basisDays, perDay, gross, pf, net };
}

let LAST_REPORT = null;

async function generateReport(){
  const month = document.getElementById('repMonth').value || todayYYYYMM();
  const zoneId = document.getElementById('repZone').value;
  window.__repMonth = month; window.__repZone = zoneId;

  let list = EMPLOYEES.filter(e=>e.active!==false);
  if(zoneId!=='all') list = list.filter(e=>e.zoneId===zoneId);

  const rows = [];
  for(const e of list){
    const data = await sget(attKey(e.id, month)) || {};
    const calc = computeSalary(e, data, month);
    rows.push({ emp: e, zone: zoneName(e.zoneId), ...calc });
  }
  LAST_REPORT = { month, zoneId, zoneLabel: zoneId==='all'?'All zones':zoneName(zoneId), rows };

  const area = document.getElementById('reportArea');
  if(rows.length===0){
    area.innerHTML = `<div class="card"><div class="empty"><div class="big">No employees to report</div>Try a different zone filter, or add employees first.</div></div>`;
    return;
  }
  const totalNet = rows.reduce((a,r)=>a+r.net,0);
  area.innerHTML = `
  <div class="card">
    <div class="section-head">
      <h2>${monthLabel(month)} · ${LAST_REPORT.zoneLabel}</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" onclick="exportExcel()">Export Excel</button>
        <button class="btn btn-outline btn-sm" onclick="exportPDF()">Export PDF</button>
      </div>
    </div>
    <table><thead><tr>
      <th>Employee</th><th>Zone</th><th>Present</th><th>Half</th><th>Absent</th><th>Leave</th>
      <th>Gross</th><th>PF</th><th>Net payable</th>
    </tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td><b>${esc(r.emp.name)}</b></td>
        <td><span class="zonetag">${esc(r.zone)}</span></td>
        <td class="num-cell positive">${r.P}</td>
        <td class="num-cell">${r.H}</td>
        <td class="num-cell deduction">${r.A}</td>
        <td class="num-cell">${r.L}</td>
        <td class="num-cell">${inr(r.gross)}</td>
        <td class="num-cell deduction">${inr(r.pf)}</td>
        <td class="num-cell"><b>${inr(r.net)}</b></td>
      </tr>`).join('')}
    </tbody>
    <tfoot><tr><td colspan="8" style="text-align:right;font-weight:600;padding:10px;">Total net payable</td><td class="num-cell" style="font-weight:700;">${inr(totalNet)}</td></tr></tfoot>
    </table>
    <p class="helptext">Salary basis: ${SETTINGS.salaryDayBasis==='calendar' ? 'actual calendar days in the month' : SETTINGS.salaryDayBasis+'-day fixed month'}. Half-days count as 0.5. Absent and leave days are unpaid. PF is calculated on the earned (present-day) amount, not the full monthly salary — adjust this convention with your accountant if needed.</p>
  </div>`;
}

async function exportExcel(){
  if(!LAST_REPORT) return;
  const { month, zoneLabel, rows } = LAST_REPORT;
  const data = rows.map(r=>({
    'Employee': r.emp.name, 'Zone': r.zone, 'Present': r.P, 'Half-day': r.H, 'Absent': r.A, 'Leave': r.L,
    'Gross Earned (₹)': Number(r.gross.toFixed(2)), 'PF Deducted (₹)': Number(r.pf.toFixed(2)), 'Net Payable (₹)': Number(r.net.toFixed(2))
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Salary Report');
  const fname = `Venkateshwar_Salary_${month}_${zoneLabel.replace(/\s+/g,'')}.xlsx`;
  XLSX.writeFile(wb, fname);
  await logAction('Generated report (Excel)', `${monthLabel(month)} — ${zoneLabel}`);
  toast('Excel report downloaded.');
}

async function exportPDF(){
  if(!LAST_REPORT) return;
  const { month, zoneLabel, rows } = LAST_REPORT;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text('Venkateshwar Agency — Salary Report', 14, 16);
  doc.setFontSize(10);
  doc.text(`${monthLabel(month)} · ${zoneLabel}`, 14, 23);
  doc.autoTable({
    startY: 28,
    head: [['Employee','Zone','P','H','A','L','Gross (₹)','PF (₹)','Net (₹)']],
    body: rows.map(r=>[r.emp.name, r.zone, r.P, r.H, r.A, r.L, r.gross.toFixed(2), r.pf.toFixed(2), r.net.toFixed(2)]),
    styles: { fontSize: 8.5 },
    headStyles: { fillColor: [24,35,56] }
  });
  const totalNet = rows.reduce((a,r)=>a+r.net,0);
  const finalY = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(10);
  doc.text(`Total net payable: Rs. ${totalNet.toFixed(2)}`, 14, finalY);
  const fname = `Venkateshwar_Salary_${month}_${zoneLabel.replace(/\s+/g,'')}.pdf`;
  doc.save(fname);
  await logAction('Generated report (PDF)', `${monthLabel(month)} — ${zoneLabel}`);
  toast('PDF report downloaded.');
}

    <div class="card">
      <h2 style="font-family:var(--font-display);font-size:17px;margin-top:0;">Supervisor password</h2>
      <p class="helptext" style="margin-top:0;">Sends a password reset link to ${esc(SUPERVISOR_EMAIL)}.</p>
      <button class="btn btn-outline" style="width:auto;" onclick="sendReset('supervisor')">Send reset link</button>
    </div>
  </div>
  <div class="card" style="margin-top:20px;">
    <h2 style="font-family:var(--font-display);font-size:17px;margin-top:0;">Salary settings</h2>
    <div class="row">
      <div class="field">
        <label>Salary day basis</label>
        <select id="setBasis">
          <option value="calendar" ${SETTINGS.salaryDayBasis==='calendar'?'selected':''}>Actual calendar days in the month</option>
          <option value="30" ${String(SETTINGS.salaryDayBasis)==='30'?'selected':''}>Fixed 30-day month</option>
          <option value="26" ${String(SETTINGS.salaryDayBasis)==='26'?'selected':''}>Fixed 26-day month</option>
        </select>
        <div class="helptext">Used to work out each employee's per-day rate from their monthly salary.</div>
      </div>
      <div class="field">
        <label>Default PF % for new employees</label>
        <input type="number" id="setDefaultPf" min="0" max="100" step="0.5" value="${SETTINGS.defaultPfPercent}">
      </div>
    </div>
    <button class="btn btn-primary" style="width:auto;" onclick="saveSettings()">Save settings</button>
  </div>`;
}

async function sendReset(role){
  const email = role==='owner' ? OWNER_EMAIL : SUPERVISOR_EMAIL;
  try{
    await auth.sendPasswordResetEmail(email);
    await logAction('Requested password reset', `${role} account (${email})`);
    toast(`Reset link sent to ${email}.`);
  }catch(e){
    toast(`Couldn't send reset email: ${e.message || 'unknown error'}`);
  }
}

async function saveSettings(){
  const basis = document.getElementById('setBasis').value;
  const defPf = parseFloat(document.getElementById('setDefaultPf').value);
  if(isNaN(defPf) || defPf<0 || defPf>100) return toast('Enter a valid default PF %.');
  SETTINGS = { salaryDayBasis: basis==='calendar'?'calendar':Number(basis), defaultPfPercent: defPf };
  await sset('settings', SETTINGS);
  await logAction('Updated salary settings', `Basis: ${basis}, Default PF: ${defPf}%`);
  toast('Settings saved.');
}
</script>
</body>
</html>
