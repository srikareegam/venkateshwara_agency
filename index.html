<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Venkateshwara Agency — Register</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#182338">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VK Agency">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app">
  <div class="auth-wrap"><div class="auth-card" style="text-align:center;color:var(--muted);">Opening the register…</div></div>
</div>
<script src="firebase-init.js"></script>
<script src="common.js"></script>
<script>
function renderLogin(errMsg){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="emblem">V</div>
      <h1 class="auth-title">Venkateshwara Agency</h1>
      <p class="auth-sub">Sign in to the register</p>
      <div id="loginErr">${errMsg?`<div class="auth-err">${esc(errMsg)}</div>`:''}</div>
      <div class="field"><label>Sign in as</label>
        <select id="loginRole" onchange="toggleLoginFields()"><option value="owner">Owner</option><option value="supervisor">Supervisor</option></select>
      </div>
      <div id="ownerFields">
        <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="Your password" onkeydown="if(event.key==='Enter')handleLogin()"></div>
      </div>
      <div id="supervisorFields" style="display:none;">
        <div class="field"><label>Username</label><input id="loginUsername" placeholder="Your username" onkeydown="if(event.key==='Enter')handleLogin()"></div>
        <div class="field"><label>Password</label><input id="loginSupPass" type="password" placeholder="Your password" onkeydown="if(event.key==='Enter')handleLogin()"></div>
      </div>
      <button class="btn btn-primary" onclick="handleLogin()">Sign in</button>
      <p class="auth-note">Owner and Supervisor accounts only. Supervisor accounts are created and managed by the Owner.</p>
    </div>
  </div>`;
}

function toggleLoginFields(){
  const role = document.getElementById('loginRole').value;
  document.getElementById('ownerFields').style.display = role==='owner' ? '' : 'none';
  document.getElementById('supervisorFields').style.display = role==='supervisor' ? '' : 'none';
}

async function handleLogin(){
  const role = document.getElementById('loginRole').value;
  const errBox = document.getElementById('loginErr');
  errBox.innerHTML = '';

  if(role === 'owner'){
    const p = document.getElementById('loginPass').value;
    try{
      await auth.signInWithEmailAndPassword(OWNER_EMAIL, p);
      localStorage.removeItem('vk_supervisor_id');
      window.location.href = 'dashboard.html';
    }catch(e){
      errBox.innerHTML = `<div class="auth-err">Sign-in failed: ${esc(e.message || 'incorrect password')}</div>`;
    }
    return;
  }

  const username = document.getElementById('loginUsername').value.trim();
  const pass = document.getElementById('loginSupPass').value;
  if(!username || !pass){ errBox.innerHTML = `<div class="auth-err">Enter your username and password.</div>`; return; }
  try{
    await auth.signInWithEmailAndPassword(SUPERVISOR_POOL_EMAIL, SUPERVISOR_POOL_PASSWORD);
    const supervisors = await sget('supervisors') || [];
    const match = supervisors.find(s => s.username && s.username.toLowerCase()===username.toLowerCase() && s.password===pass && s.active!==false);
    if(!match){
      await auth.signOut();
      errBox.innerHTML = `<div class="auth-err">Incorrect username or password.</div>`;
      return;
    }
    localStorage.setItem('vk_supervisor_id', match.id);
    window.location.href = 'dashboard.html';
  }catch(e){
    errBox.innerHTML = `<div class="auth-err">Sign-in failed: ${esc(e.message || 'unknown error')}</div>`;
  }
}

(function boot(){
  const app = document.getElementById('app');
  if(CONFIG_IS_PLACEHOLDER){
    app.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <div class="emblem">V</div>
      <h1 class="auth-title">Venkateshwara Agency</h1>
      <p class="auth-sub">Firebase not configured yet</p>
      <p style="font-size:13.5px;line-height:1.6;color:var(--ink);">
        Open <code>firebase-init.js</code> and paste in your project's config values, and set
        <code>OWNER_EMAIL</code> to your Owner account and <code>SUPERVISOR_POOL_EMAIL</code> /
        <code>SUPERVISOR_POOL_PASSWORD</code> to a technical account you create in Firebase
        Authentication (used behind the scenes for supervisor logins — individual supervisors are
        created afterwards from the Supervisors page). Save and reload.
      </p>
    </div></div>`;
    return;
  }
  waitForAuthUser().then(async (user) => {
    if(user){
      const email = (user.email||'').toLowerCase();
      if(email === OWNER_EMAIL.toLowerCase()){ window.location.href = 'dashboard.html'; return; }
      if(email === SUPERVISOR_POOL_EMAIL.toLowerCase()){
        const supervisorId = localStorage.getItem('vk_supervisor_id');
        const supervisors = supervisorId ? (await sget('supervisors') || []) : [];
        const sup = supervisorId ? supervisors.find(s=>s.id===supervisorId && s.active!==false) : null;
        if(sup){ window.location.href = 'dashboard.html'; return; }
        localStorage.removeItem('vk_supervisor_id');
        await auth.signOut();
        renderLogin();
        return;
      }
      auth.signOut().then(()=>renderLogin('That account is not set as Owner or Supervisor in this app.'));
      return;
    }
    renderLogin();
  });
})();
</script>
</body>
</html>
